# Tempo: trace storage, single process, data on the tempo_data volume.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317     # the OTel collector sends traces here

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h            # keep traces 7 days

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
