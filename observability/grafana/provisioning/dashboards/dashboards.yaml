# Loads every dashboard JSON in ./json into the "Token Service" folder at start-up.
# Dashboards are code: change the JSON in git, not in the UI (UI edits are not saved).
apiVersion: 1

providers:
  - name: token-service
    folder: Token Service
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
