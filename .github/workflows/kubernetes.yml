name: Kubernetes (kind)

# Same scripts as on a laptop: deploy/kind/{install-tools,up,smoke,debug,down}.sh
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-e2e:
    name: kind e2e (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # amd64 always; arm64 (same CPU family as Apple Silicon) where GitHub
        # offers it for free, i.e. public repositories
        runner: ${{ github.event.repository.private && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create secrets
        run: bash scripts/init-secrets.sh

      - name: Install kind, kubectl, helm (pinned, checksum-verified)
        run: bash deploy/kind/install-tools.sh

      - name: Lint and render the charts
        run: |
          helm lint deploy/helm/token-service
          helm template token-service deploy/helm/token-service > /dev/null
          bash deploy/observability/render.sh

      - name: Create cluster, build images, deploy everything through Argo CD (GitOps)
        env:
          GITOPS: "1"
          # Argo CD follows this exact commit, read with the job's own read-only token
          GITOPS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_TOKEN: ${{ github.token }}
        run: bash deploy/kind/up.sh

      - name: Smoke, security and resilience checks
        run: CHAOS=1 bash deploy/kind/smoke.sh

      - name: Observability checks (metrics, logs, traces, dashboards, SLO rules)
        run: bash deploy/observability/check.sh

      - name: Policy checks (network policies, autoscaling, Argo CD sync and self-heal)
        run: bash deploy/kind/policy-check.sh

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          bash deploy/kind/debug.sh || true
          NS=observability bash deploy/kind/debug.sh || true
          kubectl get networkpolicy -A || true
          kubectl -n argocd get applications -o wide || true
          kubectl -n argocd describe applications | grep -E "^Name:|Message:|Status:" || true

      - name: Delete cluster
        if: always()
        run: bash deploy/kind/down.sh || true
