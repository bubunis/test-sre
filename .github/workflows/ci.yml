name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The workflow only reads the repo; nothing it runs can push or change settings
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Build Validation (Fail Fast)
  build-images:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create secrets
      run: bash scripts/init-secrets.sh

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: golang-service/go.mod

    - name: Go unit tests
      working-directory: golang-service
      run: go test ./...

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Python unit tests
      working-directory: python-service
      run: uv run --frozen pytest -q tests

    - name: Validate Docker Build
      run: docker compose build

  # JOB 2: Observability & Health Check Contract
  test-health-metrics:
    name: Observability Contracts
    needs: build-images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create secrets
      run: bash scripts/init-secrets.sh

    - name: Boot up ephemeral environment
      run: |
        docker compose up -d --build
        # wait until the API is ready (database and Go service answer), at most 2 minutes
        for i in $(seq 1 60); do
          curl -sf http://localhost:8000/readyz >/dev/null && { echo "ready after $((i*2)) s"; exit 0; }
          sleep 2
        done
        echo "API not ready after 120 s"; docker compose ps; exit 1

    - name: Verify Python API Health
      run: curl -f http://localhost:8000/health

    - name: Verify Go Metrics Endpoint
      #run: docker compose exec -T golang-service wget -qO- http://localhost:9090/metrics ( Changes to this because the Go image is distroless and doesn't have wget)
      run: |
        # The Go image is distroless (no shell, no wget), so probe it from a curl container on the same network
        NET=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$(docker compose ps -q golang-service)" | awk '{print $1}')
        METRICS=$(docker run --rm --network "$NET" curlimages/curl:8.11.1 -sf http://golang-service:9090/metrics)
        echo "$METRICS" | grep -q "^go_goroutines" && echo "Go metrics endpoint OK"

    - name: View Container Logs (On Failure)
      if: failure()
      run: docker compose logs

    - name: Tear down environment
      if: always()
      run: docker compose down

  # JOB 3: End-to-End Critical User Journey (Stateful)
  test-e2e-token-flow:
    name: Stateful E2E Flow
    needs: build-images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create secrets
      run: bash scripts/init-secrets.sh

    - name: Boot up ephemeral environment
      run: |
        docker compose up -d --build
        # wait until the API is ready (database and Go service answer), at most 2 minutes
        for i in $(seq 1 60); do
          curl -sf http://localhost:8000/readyz >/dev/null && { echo "ready after $((i*2)) s"; exit 0; }
          sleep 2
        done
        echo "API not ready after 120 s"; docker compose ps; exit 1

    - name: Integration Test - Callers without a valid JWT are refused
      run: |
        code() { curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/token \
                   -H "Content-Type: application/json" -d '{"user_email": "alice@example.com"}' "$@"; }
        fail=0
        c=$(code);                                               echo "no token      -> $c"; [ "$c" = 401 ] || fail=1
        c=$(code -H "Authorization: Bearer not.a.jwt");          echo "garbage token -> $c"; [ "$c" = 401 ] || fail=1
        BAD=$(bash scripts/dev-token.sh login-service profile)
        c=$(code -H "Authorization: Bearer $BAD");               echo "wrong scope   -> $c"; [ "$c" = 403 ] || fail=1
        # expired 2 minutes ago: beyond the API's 30 s clock-skew leeway
        OLD=$(bash scripts/dev-token.sh login-service token:mint -120)
        c=$(code -H "Authorization: Bearer $OLD");               echo "expired       -> $c"; [ "$c" = 401 ] || fail=1
        exit $fail

    - name: Integration Test - Mint Token & Verify Permissions
      run: |
        JWT=$(bash scripts/dev-token.sh)
        echo "Requesting token for alice@example.com..."
        RESPONSE=$(curl -s -X POST http://localhost:8000/token \
          -H "Authorization: Bearer $JWT" \
          -H "Content-Type: application/json" \
          -d '{"user_email": "alice@example.com"}')
          
        # don't print the response: it contains a live token
        echo "API answered with $(echo "$RESPONSE" | jq -r '.permissions | length') permissions"
        
        TOKEN=$(echo $RESPONSE | jq -r .token)
        PERMISSIONS=$(echo $RESPONSE | jq -r '.permissions | join(",")')
        
        if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
          echo "ERROR: Failed to generate token!"
          exit 1
        fi
        
        if [[ "$PERMISSIONS" != *"read:data"* ]]; then
          echo "ERROR: Database join failed. Missing permissions!"
          exit 1
        fi
        
        echo "TOKEN=$TOKEN" >> $GITHUB_ENV

    - name: Integration Test - Verify Redis Storage
      run: |
        echo "Checking that the Go service stored the token in Redis..."
        
        REDIS_VAL=$(docker compose exec -T -e REDISCLI_AUTH="$(cat secrets/redis_password.txt)" redis redis-cli GET "token:${{ env.TOKEN }}")
        
        if [[ "$REDIS_VAL" != *"alice@example.com"* ]]; then
          echo "ERROR: Token payload not found in Redis!"
          exit 1
        fi
        echo "SUCCESS: E2E Token flow validated!"

    - name: View Container Logs (On Failure)
      if: failure()
      run: docker compose logs

    - name: Tear down environment
      if: always()
      run: docker compose down

  # JOB 4: Supply-chain and secret scans
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code (full history, for the secret scan)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Secrets in git history (gitleaks)
      run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --verbose

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: golang-service/go.mod

    - name: Go vulnerabilities (govulncheck)
      working-directory: golang-service
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
        "$(go env GOPATH)/bin/govulncheck" ./...

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Python vulnerabilities (pip-audit)
      working-directory: python-service
      run: |
        uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
        uvx pip-audit==2.7.3 -r /tmp/requirements.txt --disable-pip --no-deps

    - name: Create secrets (needed to build)
      run: bash scripts/init-secrets.sh

    - name: Image vulnerabilities (trivy, report only for now)
      run: |
        docker compose build golang-service python-service
        for img in $(docker compose config --images | grep -E 'golang-service|python-service'); do
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$img"
        done
