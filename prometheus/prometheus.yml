global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'python-token-service'
    static_configs:
      - targets: ['python-service:8000']

  - job_name: 'go-token-service'
    static_configs:
      - targets: ['golang-service:9090']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
