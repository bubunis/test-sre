# Loki in monolithic mode (one pod), filesystem storage on a PVC.
# Based on Grafana's "single replica, filesystem" example, with the caches,
# canary, gateway and test pod turned off to save memory.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true   # trace_id / span_id from OTLP logs
    volume_enabled: true
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { memory: 512Mi }

# Not needed for one small Loki
gateway: { enabled: false }
chunksCache: { enabled: false }     # memcached; the default asks for gigabytes of memory
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
sidecar:
  rules: { enabled: false }

backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
bloomGateway: { replicas: 0 }
