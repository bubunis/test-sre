# Who may reach Loki, Tempo and the collector. Without these, any pod in the
# cluster could read every log and trace, or write fake ones.
#   apps (namespace token-service) -> collector :4317/:4318
#   collector                      -> Loki :3100, Tempo :4317/:4318
#   Grafana                        -> Loki :3100, Tempo :3200
# `kubectl port-forward` (ui.sh, check.sh) goes through the kubelet and still works.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: token-service
      ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - { port: 3100, protocol: TCP }
    - from:                       # Loki talking to itself (memberlist ring, gRPC)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - { port: 3200, protocol: TCP }
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
