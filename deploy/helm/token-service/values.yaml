# Defaults for a local kind cluster. Secrets are NOT in this file:
# deploy/kind/up.sh creates them from ./secrets before installing the chart.

# Names of Secrets / ConfigMaps created outside the chart.
# Each workload mounts only the Secret it needs.
existingSecrets:
  db: token-db            # keys: password (superuser, Postgres only), app-password (API)
  redis: token-redis      # keys: password, redis.conf
  jwt: token-jwt          # key: public.pem
dbInitConfigMap: token-db-init   # keys: 01-schema.sql, 02-app-role.sh (database/)

# Shared settings for every pod
podSecurity:
  seccompProfile: RuntimeDefault

# Spread API and Go pods over zones (kind: one worker per zone) and nodes.
# DoNotSchedule = refuse to stack both replicas in one zone (production behaviour).
# Set to ScheduleAnyway on a single-node cluster.
topologySpread:
  enabled: true
  whenUnsatisfiable: DoNotSchedule

otel:
  # Where traces and logs go. Empty = no OTLP export (logs still go to stdout
  # as JSON). deploy/kind/up.sh sets it when the observability stack is installed.
  endpoint: ""

# Who may talk to whom. Each workload accepts traffic only from the pods that
# need it, and sends only where it has to (plus DNS). See templates/networkpolicy.yaml.
networkPolicy:
  enabled: true
  observabilityNamespace: observability   # where Prometheus and the OTel collector run
  # Extra sources allowed into every pod, e.g. the node network if a CNI treats
  # kubelet probes as pod traffic. Empty on kind: node traffic is always allowed.
  extraIngressCIDRs: []
  # Extra destinations for the API, e.g. the identity provider when JWT_JWKS_URL is set:
  #   - to: [{ipBlock: {cidr: 203.0.113.10/32}}]
  #     ports: [{port: 443, protocol: TCP}]
  apiExtraEgress: []

# Recording rules and alerts for the /token SLOs (PrometheusRule; only rendered
# when the cluster has the CRD, i.e. kube-prometheus-stack is installed).
slo:
  enabled: true
  availability: 0.995      # 99.5% of /token calls don't fail with a 5xx (30-day window)
  latencySeconds: 0.5      # a bucket of the API's latency histogram (0.1, 0.5 or 1)
  latencyTarget: 0.95      # 95% of /token calls finish within latencySeconds

metrics:
  # ServiceMonitors for Prometheus (kube-prometheus-stack). Only rendered when
  # the cluster has the ServiceMonitor CRD.
  serviceMonitor:
    enabled: false
    interval: 10s

api:
  image:
    repository: token-api
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 2             # used only when autoscaling is off
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5          # x DB_POOL_MAX (10) = 50 = the token_api connection limit
    cpuUtilization: 70      # % of the CPU request
  uid: 10001
  port: 8000
  service:
    type: NodePort
    nodePort: 30080       # kind maps this to 127.0.0.1:8080 on the Mac
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  config:
    DB_POOL_MIN: "2"
    DB_POOL_MAX: "10"
    DB_POOL_TIMEOUT_SECONDS: "2"
    DB_STATEMENT_TIMEOUT_MS: "2000"
    GRPC_TIMEOUT_SECONDS: "2"
    # DEV identity provider (the dev key pair). In production set JWT_JWKS_URL
    # and drop the jwt Secret.
    JWT_ISSUER: https://idp.dev.local
    JWT_AUDIENCE: token-service
    JWT_ALGORITHMS: ES256
    JWT_REQUIRED_SCOPE: token:mint
    JWT_LEEWAY_SECONDS: "30"

grpc:
  image:
    repository: token-grpc
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 2             # used only when autoscaling is off; pods share the Redis queue
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 70
  uid: 65532
  port: 50051
  metricsPort: 9090
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 128Mi }
  config:
    TOKEN_EVENT_WORK_MS: "0"

postgres:
  image: postgres:15-alpine
  uid: 70                 # "postgres" user in the alpine image
  database: tokendb
  user: postgres          # superuser: used only by Postgres itself for setup
  appUser: token_api      # what the API logs in as: SELECT on three tables
  storage: 1Gi
  storageClass: ""        # empty = cluster default (kind: "standard")
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

redis:
  image: redis:7-alpine
  uid: 999                # "redis" user in the alpine image
  gid: 1000
  # Redis holds short-lived tokens and the event stream; emptyDir is fine for
  # the demo. Use a PVC (or a managed Redis) if tokens must survive a restart.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }
