# Argo CD sized for a laptop / CI runner. No SSO (dex), no notifications.
dex:
  enabled: false
notifications:
  enabled: false
configs:
  params:
    server.insecure: false           # UI over HTTPS (self-signed) through port-forward only
  cm:
    timeout.reconciliation: 60s      # notice a push within a minute (default 3 min)
    exec.enabled: "false"            # no shell into pods from the UI
    admin.enabled: "true"            # local demo login; production: SSO and no admin user
    # the dashboards app builds a ConfigMap from files outside its own folder
    kustomize.buildOptions: --load-restrictor LoadRestrictionsNone
    # child Applications report health, so sync waves wait for each layer
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then hs.message = obj.status.health.message end
      end
      return hs
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }
server:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits:   { memory: 128Mi }
applicationSet:
  replicas: 0                        # not used
