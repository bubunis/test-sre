# Local Kubernetes cluster (kind = Kubernetes in Docker): 1 control plane + 2 workers.
#
# Close to a production layout, small enough for a laptop or a GitHub runner
# (~1.5 GB for the three nodes before any app pods):
#   - the control plane keeps its NoSchedule taint, so apps run only on workers
#   - each worker is labelled as its own availability zone; the chart spreads
#     API and Go pods across zones, so losing one worker loses half, not all
#
# Port 30080 (the API's NodePort) is published on this machine as 127.0.0.1:8080.
# kube-proxy answers a NodePort on every node, so it works from the control
# plane even though no app pod runs there.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: token-service
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
