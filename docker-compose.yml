# Step 1: no hardcoded passwords, nothing published except the API.
# Step 3: POST /token requires a valid JWT (see JWT_* settings on python-service).
# O0: Grafana stack - Tempo (traces), Loki (logs), Prometheus (metrics), Grafana (UI).
#     Config lives in ./observability. Grafana and Prometheus UIs are on 127.0.0.1 only.
# Secrets are read from ./secrets (created by scripts/init-secrets.sh, never committed).

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tokendb
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # no "ports:" - reachable only by other containers

  redis:
    image: redis:7-alpine
    # requirepass is set in the mounted config file, not on the command line
    command: ["redis-server", "/run/secrets/redis_conf"]
    secrets:
      - redis_conf
      - redis_password
    # no "ports:" - reachable only by other containers

  # ---------- Observability (Grafana stack) ----------

  otel-collector:
    # contrib build: includes the transform processor used to mask emails in logs
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    # no "ports:" - services reach it on the internal network

  tempo-init:
    # one-off: give the Tempo data volume to Tempo's user (10001), then exit
    image: grafana/tempo:2.6.1
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo_data:/var/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    # no "ports:" - Grafana queries it on the internal network

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    # no "ports:" - Grafana queries it on the internal network

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090" # UI, this machine only
    depends_on:
      - golang-service
      - python-service

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    secrets:
      - grafana_admin_password
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000" # UI, this machine only
    depends_on:
      - prometheus
      - loki
      - tempo

  # ---------- Application ----------

  golang-service:
    build:
      context: ./golang-service
      dockerfile: Dockerfile
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - TOKEN_EVENT_WORK_MS=${TOKEN_EVENT_WORK_MS:-0}
    secrets:
      - redis_password
    depends_on:
      - redis
      - otel-collector
    # no "ports:" - gRPC and /metrics are internal only

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    environment:
      # no password in the URL; it is read from DB_PASSWORD_FILE
      - DATABASE_URL=postgres://postgres@postgres:5432/tokendb
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
      - TOKEN_SERVICE_HOST=golang-service:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      # Step 3: callers must send a JWT. DEV values: the dev key pair stands in for the
      # identity provider. In production use JWT_JWKS_URL instead of JWT_PUBLIC_KEY_FILE.
      - JWT_ISSUER=https://idp.dev.local
      - JWT_AUDIENCE=token-service
      - JWT_ALGORITHMS=ES256
      - JWT_REQUIRED_SCOPE=token:mint
      - JWT_PUBLIC_KEY_FILE=/run/secrets/jwt_public
    secrets:
      - postgres_password
      - jwt_public
    ports:
      - "8000:8000" # the only service reachable from outside
    depends_on:
      - postgres
      - golang-service
      - otel-collector

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  redis_conf:
    file: ./secrets/redis.conf
  jwt_public:
    file: ./secrets/jwt_dev_public.pem   # public key only; the private key never enters a container
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  tempo_data: {}
  loki_data: {}
  prometheus_data: {}
  grafana_data: {}
