#version: '5.7'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tokendb
    ports:
      # Mapped to 5433 on your Mac to avoid conflicts with local Postgres installs
      - "5433:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      # Mapped to 9091 to avoid clashing with the Go service
      - "9091:9090"
    depends_on:
      - golang-service
      - python-service

  golang-service:
    build: 
      context: ./golang-service
      dockerfile: Dockerfile
    environment:
      - REDIS_ADDR=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      # Mapped to 50052 to bypass your Mac's locked 50051 port
      - "50052:50051"
      - "9090:9090"   # Prometheus metrics port
    depends_on:
      - redis
      - otel-collector

  python-service:
    build: 
      context: ./python-service
      dockerfile: Dockerfile
    environment:
      # Uses the internal Docker network port 5432, completely isolated from your Mac's 5433
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/tokendb
      - TOKEN_SERVICE_HOST=golang-service:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - golang-service
      - otel-collector