# Step 1: no hardcoded passwords, nothing published except the API.
# Secrets are read from ./secrets (created by scripts/init-secrets.sh, never committed).

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tokendb
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # no "ports:" - reachable only by other containers

  redis:
    image: redis:7-alpine
    # requirepass is set in the mounted config file, not on the command line
    command: ["redis-server", "/run/secrets/redis_conf"]
    secrets:
      - redis_conf
      - redis_password
    # no "ports:" - reachable only by other containers

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686" # Web UI, this machine only

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - jaeger
    # no "ports:" - services reach it on the internal network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090" # UI, this machine only
    depends_on:
      - golang-service
      - python-service

  golang-service:
    build:
      context: ./golang-service
      dockerfile: Dockerfile
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    secrets:
      - redis_password
    depends_on:
      - redis
      - otel-collector
    # no "ports:" - gRPC and /metrics are internal only

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    environment:
      # no password in the URL; it is read from DB_PASSWORD_FILE
      - DATABASE_URL=postgres://postgres@postgres:5432/tokendb
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
      - TOKEN_SERVICE_HOST=golang-service:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    secrets:
      - postgres_password
    ports:
      - "8000:8000" # the only service reachable from outside
    depends_on:
      - postgres
      - golang-service
      - otel-collector

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  redis_conf:
    file: ./secrets/redis.conf
